
# Dataset Configuration
dataset:
  name: "ag_news"  # Options: ag_news, 20newsgroups
  test_size: 0.2
  random_state: 42

# Preprocessing Configuration
preprocessing:
  lowercase: true
  remove_stopwords: true
  lemmatize: true
  min_word_length: 2
  max_features: 10000
  ngram_range: [1, 2]
  max_df: 0.85
  min_df: 2

# Model Configuration
models:
  naive_bayes:
    alpha: [0.1, 0.5, 1.0]
  logistic_regression:
    C: [0.1, 1.0, 10.0]
    max_iter: [1000]
    solver: ['lbfgs']

# Training Configuration
training:
  cv_folds: 5
  n_jobs: -1
  verbose: 1
  scoring: 'f1_macro'

# Paths
paths:
  data_dir: "./data"
  models_dir: "./models"
  results_dir: "./results"