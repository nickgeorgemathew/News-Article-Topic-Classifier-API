
# Dataset Configuration
dataset:
  flag: custom #set to null if dataset is loaded from hugging face
  paths:
    test: "C:/Users/nikhi/Downloads/News-Article-Topic-Classifier-API/nlp_classifier_scratch/test.csv"
    train: "C:/Users/nikhi/Downloads/News-Article-Topic-Classifier-API/nlp_classifier_scratch/train.csv"
  name: "ag_news"  # Options: ag_news, 20newsgroups
  test_size: 0.2
  random_state: 42

# Preprocessing Configuration
preprocessing:
  lowercase: true
  remove_stopwords: true
  lemmatize: true
  min_word_length: 2
  max_features: 10000
  ngram_range: [1, 2]
  max_df: 0.85
  min_df: 2

# Model Configuration
models:
  logistic_regression:
    C: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
    penalty: ['l2']
    solver: ['saga']
    max_iter: [1000, 2000, 3000]
    class_weight: [null, 'balanced'] 

  naive_bayes:
    alpha: [0.01, 0.05, 0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
    fit_prior: [true, false]


# Training Configuration
training:
  iter:  30
  cv_folds: 5
  n_jobs: -1
  verbose: 1
  scoring: 'f1_macro'

# Paths
paths:
  data_dir: "./data"
  models_dir: "./models"
  results_dir: "./results"